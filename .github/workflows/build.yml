name: Build CloakChat

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  linux:
    name: Linux GUI executable
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-gui.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libgl1-mesa-dev libmtdev-dev

      - name: Install Python dependencies
        run: python -m pip install -r requirements-gui.txt

      - name: Run protocol tests
        run: python -m unittest discover -s tests -v
      - name: Build Linux executable
        run: python -m PyInstaller --clean --noconfirm CloakChatGUI.spec

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloakChat-linux-x86_64
          path: dist/CloakChatGUI
          if-no-files-found: error

  windows:
    name: Windows GUI executable
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-gui.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-gui.txt

      - name: Run protocol tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm CloakChatGUI.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloakChat-windows-x64
          path: dist/CloakChatGUI.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev automake autopoint gettext libtool-bin libltdl-dev m4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Buildozer
        run: |
          python -m venv .venv-buildozer
          . .venv-buildozer/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer<2" "cython==0.29.34"

      - name: Cache Android toolchains
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle/caches
          key: cloakchat-android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            cloakchat-android-${{ runner.os }}-

      - name: Pre-fetch FreeType from mirror
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/freetype-2.14.1.tar.gz"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
            "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download" \
            --output "$tmp"
          # p4a dùng package cache theo nhiều layout tùy phiên bản; seed
          # cả cache global và storage-dir của Buildozer.
          for dir in \
            "$HOME/.buildozer/android/packages" \
            "$HOME/.buildozer/android/packages/freetype" \
            "$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"; do
            mkdir -p "$dir"
            cp "$tmp" "$dir/freetype-2.14.1.tar.gz"
          done

      - name: Build debug APK with retry
        run: |
          # GitHub Actions chạy bash với -e -o pipefail mặc định. Đặt phần
          # `yes | buildozer` trong script riêng để SIGPIPE của yes không làm
          # dừng sớm vòng retry.
          cat > /tmp/build_android_retry.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set +e
          set +o pipefail
          source .venv-buildozer/bin/activate
          attempt=1
          rc=1
          while [ "$attempt" -le 3 ]; do
            echo "Android build attempt $attempt/3"
            yes | buildozer -v android debug
            rc=${PIPESTATUS[1]}
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            echo "Buildozer thất bại với mã $rc; chờ trước khi thử lại..."
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
          exit "$rc"
          SCRIPT
          bash /tmp/build_android_retry.sh

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloakChat-android-debug
          path: bin/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          chmod +x release-files/CloakChatGUI 2>/dev/null || true
          ls -lah release-files

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "CloakChat ${GITHUB_REF_NAME}"
